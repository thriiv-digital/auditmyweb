name = "auditmyweb"
main = "worker.js"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./"
binding = "ASSETS"

[browser]
binding = "MYBROWSER"

# Secrets (set via `wrangler secret put <NAME>` or the Cloudflare dashboard —
# never committed here):
#   ANTHROPIC_API_KEY — Anthropic API key for the vision analysis call
# (Browser Rendering no longer needs a separate API token/account ID — the
# [browser] binding above authenticates automatically, same as any other binding.)
